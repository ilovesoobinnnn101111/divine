name: Divine Farm Tests

on:
  push:
    branches:
      - feature/farm-system-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: farm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d farm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          find src/services/farm src/commands/Farm src/interactions/buttons/farmButtons.js src/interactions/modals/farmRemoveAlts.js src/events/farmSessionExpiry.js src/events/farmAutoReplies.js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run farm unit tests
        run: node --test tests/farm.test.js
      - name: Run isolated PostgreSQL integration test
        env:
          TEST_POSTGRES_URL: postgresql://test:test@localhost:5432/farm_test
        run: node --test tests/farm-postgres.test.js
