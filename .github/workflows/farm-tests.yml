name: Divine Farm Tests

on:
  push:
    branches:
      - feature/farm-system-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          find src/services/farm src/commands/Farm src/interactions/buttons/farmButtons.js src/interactions/modals/farmRemoveAlts.js src/events/farmSessionExpiry.js src/events/farmAutoReplies.js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run farm unit tests
        run: node --test tests/farm.test.js
